# PostgreSQL de desarrollo para este proyecto.
# Usa el puerto 5433 para no chocar con el PostgreSQL instalado en Windows (5432).
services:
  db:
    image: postgres:18-alpine
    container_name: loyalty-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: loyalty
      POSTGRES_PASSWORD: loyalty
      POSTGRES_DB: loyalty
    ports:
      - '5433:5432'
    volumes:
      - loyalty-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U loyalty -d loyalty']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  loyalty-db-data:
